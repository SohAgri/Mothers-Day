<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Memory placeholder image</title>
  <desc id="desc">Placeholder memory card image for Mother's Day tribute gallery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8dc" />
      <stop offset="100%" stop-color="#f3c8b2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g fill="#7a4f3a" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="365" font-size="64" font-weight="600">Photo Placeholder</text>
    <text x="600" y="430" font-size="34">Replace with your memory photo</text>
  </g>
</svg>
